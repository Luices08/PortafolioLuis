services:

  mongodb:
    image: mongo:8
    container_name: portfolio-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - portfolio-mongodb-data:/data/db

  backend:
    build:
      context: ./backend
    container_name: portfolio-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/portfolio-ai
    depends_on:
      - mongodb
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api
    container_name: portfolio-frontend
    restart: unless-stopped
    environment:
      - INTERNAL_API_URL=http://backend:4000/api
    depends_on:
      - backend
    ports:
      - "3005:3000"

volumes:
  portfolio-mongodb-data: